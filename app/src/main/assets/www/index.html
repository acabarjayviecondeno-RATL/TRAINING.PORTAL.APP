<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Portal - Login</title>
    <LINk rel="icon" type="img/png" href="dashboard.png"> </LINk>
    <link href="https://fonts.cdnfonts.com/css/samsung-sharp-sans" rel="stylesheet">
    <link href="https://db.onlinewebfonts.com/c/05c77f210065b750f9ad9d606be229d2?family=SamsungOne+600C" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --blue: #0f172a;
            --blue-dark: #000000;
            --ink: #0f172a;
            --text: #475569;
            --muted: #64748b;
            --line: #e2e8f0;
            --idle: #b4bfce;
            --danger: #dc2626;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: "SamsungOne 600C", "Samsung Sharp Sans", "SamsungOne", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #fff;
            color: var(--ink);
            min-height: 100vh; min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- PAGE ---------- */
        .login-container {
            position: relative;
            min-height: 100vh; min-height: 100dvh;
            display: flex; flex-direction: column;
            overflow: hidden;
            background:
                radial-gradient(900px 700px at 78% 62%, rgba(15, 23, 42, 0.09), transparent 65%),
                #fff;
        }
        .topbar {
            position: relative; z-index: 3;
            display: flex; align-items: center; justify-content: space-between;
            padding: 22px clamp(20px, 3.6vw, 56px);
        }
        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .brand-mark {
            width: 38px; height: 38px; border-radius: 11px;
            background: var(--ink); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 14px; letter-spacing: .02em;
            box-shadow: 0 6px 16px rgba(15, 23, 42, .28);font-family:"Samsung Sharp Sans Bold", "Samsung Sharp Sans", "SamsungSharpSans-Bold", "Samsung Sharp Bold", "SamsungOne 600C", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif}
        .brand-name { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; color: var(--ink);font-family:"Samsung Sharp Sans Bold", "Samsung Sharp Sans", "SamsungSharpSans-Bold", "Samsung Sharp Bold", "SamsungOne 600C", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif}

        .split {
            position: relative; z-index: 2;
            flex: 1;
            width: 100%; max-width: 1240px; margin: 0 auto;
            padding: 0 clamp(20px, 3.6vw, 56px);
            display: grid;
            grid-template-columns: minmax(0, 470px) minmax(0, 1fr);
            column-gap: clamp(32px, 6vw, 96px);
            align-items: center;
        }

        /* ---------- FORM ---------- */
        .login-card { width: 100%; padding-bottom: 6vh; animation: rise .45s ease both; }
        @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        .login-card h2 {
            margin: 0 0 10px; font-size: clamp(36px, 4.4vw, 48px); line-height: 1.05;
            font-weight: 800; letter-spacing: -0.035em; color: var(--ink);font-family:"Samsung Sharp Sans Bold", "Samsung Sharp Sans", "SamsungSharpSans-Bold", "Samsung Sharp Bold", "SamsungOne 600C", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif}
        .sub { margin: 0 0 34px; font-size: 16px; color: var(--text); line-height: 1.5; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 700; color: var(--ink);font-family:"Samsung Sharp Sans Bold", "Samsung Sharp Sans", "SamsungSharpSans-Bold", "Samsung Sharp Bold", "SamsungOne 600C", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif}

        .field {
            position: relative; display: flex; align-items: center;
            height: 58px; background: #fff;
            border: 1px solid var(--line); border-radius: 14px;
            overflow: hidden; background-clip: padding-box;
            transition: border-color .2s, box-shadow .2s;
        }
        .field:focus-within { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(15, 23, 42, .12); }
        .field input {
            flex: 1; min-width: 0; height: 100%;
            border: 0; outline: 0; background: transparent;
            padding: 0 18px; font: inherit; font-size: 16px; color: var(--ink);
        }
        .field input::placeholder { color: #9aa6b8; }
        .field input { -webkit-appearance: none; appearance: none; border-radius: 0; box-shadow: none; }
        /* autofill / filled state: paint inside the field only so the rounded border is never covered */
        .field input:-webkit-autofill,
        .field input:-webkit-autofill:hover,
        .field input:-webkit-autofill:focus,
        .field input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px #fff inset !important;
            box-shadow: 0 0 0 1000px #fff inset !important;
            -webkit-text-fill-color: var(--ink) !important;
            caret-color: var(--ink);
            border: 0 !important; border-radius: 0 !important;
            transition: background-color 99999s ease-out 0s;
        }


        /* ---------- MOVING GEOMETRY BACKGROUND ---------- */
        .geo { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; --g1: rgba(15, 23, 42, .16); --g2: rgba(15, 23, 42, .30); }
        .geo .sh { position: absolute; display: block; will-change: transform; }
        .geo svg { overflow: visible; fill: none; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
        .geo .c1 { color: var(--g1); } .geo .c2 { color: var(--g2); }
        .geo svg * { stroke: currentColor; }
        .geo .fill { fill: currentColor; stroke: none; }
        .geo .ring { border-radius: 50%; border: 1.5px dashed var(--g1); }
        .geo .ring.solid { border-style: solid; border-color: rgba(15, 23, 42, .16); }
        .geo .sq { border: 1.6px solid var(--g1); border-radius: 14px; }
        .geo .sq.f { border: 0; background: linear-gradient(135deg, rgba(15, 23, 42, .14), rgba(15, 23, 42, .03)); }
        .geo .orb { border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgba(15, 23, 42, .38), rgba(15, 23, 42, .05)); }
        .geo .dots { background-image: radial-gradient(rgba(15, 23, 42, .22) 1.6px, transparent 1.7px); background-size: 18px 18px; -webkit-mask-image: radial-gradient(circle, #000 30%, transparent 75%); mask-image: radial-gradient(circle, #000 30%, transparent 75%); }
        .geo .ln { height: 1.6px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--g2), transparent); }

        .g-spin   { animation: geoSpin 60s linear infinite; }
        .g-spinr  { animation: geoSpin 42s linear infinite reverse; }
        .g-float  { animation: geoFloat 9s ease-in-out infinite; }
        .g-float2 { animation: geoFloat2 12s ease-in-out infinite; }
        .g-drift  { animation: geoDrift 16s ease-in-out infinite; }
        .g-pulse  { animation: geoPulse 6s ease-in-out infinite; }
        .g-slide  { animation: geoSlide 11s ease-in-out infinite; }
        @keyframes geoSpin   { to { transform: rotate(360deg); } }
        @keyframes geoFloat  { 0%,100% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(18px,-30px) rotate(25deg); } }
        @keyframes geoFloat2 { 0%,100% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(-26px,22px) rotate(-30deg); } }
        @keyframes geoDrift  { 0%,100% { transform: translate(0,0); } 50% { transform: translate(34px,-20px); } }
        @keyframes geoPulse  { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.25); opacity: .5; } }
        @keyframes geoSlide  { 0%,100% { transform: translateX(-30px); opacity: .4; } 50% { transform: translateX(40px); opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { .geo .sh { animation: none !important; } }
        @media (max-width: 900px) { .geo .big { display: none; } .geo { opacity: .7; } }

        /* ---------- LOADING SCREEN ---------- */
        #loader { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; flex-direction: column; overflow: hidden; color: #fff;
            background: radial-gradient(900px 600px at 20% 15%, #2b2b2b 0%, transparent 60%), radial-gradient(800px 600px at 85% 90%, #3a3a3a 0%, transparent 60%), linear-gradient(160deg, #000000, #0a0a0a 55%, #1c1c1c);
            opacity: 0; transition: opacity .35s ease; }
        #loader.show { display: flex; }
        #loader.in { opacity: 1; }
        #loader .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .28; animation: ldFloat 9s ease-in-out infinite; }
        #loader .b1 { width: 340px; height: 340px; background: #6b7280; top: -80px; left: -60px; }
        #loader .b2 { width: 380px; height: 380px; background: #9ca3af; bottom: -120px; right: -80px; animation-delay: -4s; }
        #loader .gridbg { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 44px 44px; -webkit-mask-image: radial-gradient(circle at center, #000 0%, transparent 70%); mask-image: radial-gradient(circle at center, #000 0%, transparent 70%); }
        .ld-core { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 24px; width: 100%; max-width: 420px; }
        .ld-orbit { position: relative; width: 128px; height: 128px; display: grid; place-items: center; margin-bottom: 26px; }
        .ld-orbit .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,.14); border-top-color: #fff; animation: ldSpin 1.4s linear infinite; }
        .ld-orbit .ring.r2 { inset: 12px; border-top-color: transparent; border-right-color: #d4d4d8; animation-duration: 2.2s; animation-direction: reverse; }
        .ld-orbit .dot { position: absolute; inset: 0; animation: ldSpin 2.8s linear infinite; }
        .ld-orbit .dot::after { content: ""; position: absolute; top: -4px; left: 50%; width: 9px; height: 9px; margin-left: -4px; border-radius: 50%; background: #fde68a; box-shadow: 0 0 14px 4px rgba(253,230,138,.7); }
        .ld-logo { width: 68px; height: 68px; border-radius: 22px; display: grid; place-items: center; font-weight: 800; font-size: 24px; letter-spacing: -.03em; background: linear-gradient(145deg, rgba(255,255,255,.28), rgba(255,255,255,.08)); border: 1px solid rgba(255,255,255,.35); box-shadow: 0 14px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.4); animation: ldPulse 2.2s ease-in-out infinite;font-family:"Samsung Sharp Sans Bold", "Samsung Sharp Sans", "SamsungSharpSans-Bold", "Samsung Sharp Bold", "SamsungOne 600C", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif}
        .ld-title { font-size: clamp(28px, 6vw, 40px); font-weight: 800; letter-spacing: -.03em; margin: 0; line-height: 1.1;font-family:"Samsung Sharp Sans Bold", "Samsung Sharp Sans", "SamsungSharpSans-Bold", "Samsung Sharp Bold", "SamsungOne 600C", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif}
        .ld-title span { background: linear-gradient(90deg, #fff, #d4d4d8, #fff); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: ldShine 3s linear infinite; }
        .ld-role { margin: 10px 0 0; font-size: 12px; font-weight: 700; letter-spacing: .42em; text-indent: .42em; color: rgba(255,255,255,.85); text-transform: uppercase;font-family:"Samsung Sharp Sans Bold", "Samsung Sharp Sans", "SamsungSharpSans-Bold", "Samsung Sharp Bold", "SamsungOne 600C", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif}
        .ld-bar { width: 100%; max-width: 280px; height: 6px; border-radius: 99px; background: rgba(255,255,255,.18); margin: 26px 0 14px; overflow: hidden; position: relative; }
        .ld-bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #a1a1aa, #fff); box-shadow: 0 0 14px rgba(255,255,255,.6); }
        #loader.in .ld-bar i { animation: ldFill 1.3s cubic-bezier(.4,0,.2,1) forwards; }
        .ld-msg { font-size: 13px; color: rgba(255,255,255,.88); }
        @keyframes ldFill { to { width: 100%; } }
        @keyframes ldSpin { to { transform: rotate(360deg); } }
        @keyframes ldPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
        @keyframes ldShine { to { background-position: -200% 0; } }
        @keyframes ldFloat { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,30px); } }
        .eye {
            flex: none; width: 52px; height: 100%; margin: 0; padding: 0;
            display: flex; align-items: center; justify-content: center;
            background: transparent; border: 0; border-radius: 0 14px 14px 0;
            color: #8a97ab; cursor: pointer;
        }
        .eye:hover { color: var(--blue); }
        .eye svg { width: 22px; height: 22px; }

        #loginBtn, #changeBtn {
            width: 100%; height: 58px; margin-top: 10px; padding: 0;
            border: 0; border-radius: 999px;
            background: var(--idle); color: #fff;
            font: inherit; font-size: 17px; font-weight: 700; letter-spacing: .005em;
            cursor: pointer; transition: background .2s, box-shadow .2s, transform .15s;font-family:"Samsung Sharp Sans Bold", "Samsung Sharp Sans", "SamsungSharpSans-Bold", "Samsung Sharp Bold", "SamsungOne 600C", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif}
        #loginBtn.ready, #changeBtn.ready { background: var(--blue); box-shadow: 0 10px 24px rgba(15, 23, 42, .30); }
        #loginBtn.ready:hover, #changeBtn.ready:hover { background: var(--blue-dark); transform: translateY(-1px); }
        #loginBtn:disabled, #changeBtn:disabled { opacity: .7; cursor: progress; transform: none; }

        .error-msg { min-height: 18px; margin-top: 14px; color: var(--danger); font-size: 13px; font-weight: 500; text-align: center; }
        .fine { margin: 22px 0 0; text-align: center; font-size: 13px; line-height: 1.6; color: #8a97ab; }

        /* ---------- MODEL ---------- */
        .hero { position: relative; align-self: end; display: flex; justify-content: center; min-height: 0; }
        .hero img {
            display: block; width: auto; max-width: 100%;
            height: min(calc(100vh - 96px), calc(100dvh - 96px), 900px);
            object-fit: contain; object-position: bottom center;
            filter: drop-shadow(0 28px 40px rgba(15, 23, 42, .14));
            animation: rise .6s .08s ease both;
            user-select: none; -webkit-user-drag: none;
        }

        /* ---------- PASSWORD CHANGE MODAL ---------- */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 999; display: none;
            align-items: center; justify-content: center; padding: 20px; overflow-y: auto;
            background: rgba(15, 23, 42, .45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        }
        .modal-overlay .login-card {
            max-width: 440px; margin: auto; padding: 36px; background: #fff;
            border: 1px solid var(--line); border-radius: 22px;
            box-shadow: 0 30px 80px rgba(15, 23, 42, .30);
        }
        .modal-overlay h2 { font-size: 30px; }
        .modal-overlay .sub { margin-bottom: 24px; font-size: 14px; }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 900px) {
            .split { grid-template-columns: minmax(0, 1fr); max-width: 520px; align-items: start; padding-top: 4vh; }
            .hero { display: none; }
            .login-card { padding-bottom: 40px; }
        }
        @media (max-width: 480px) {
            .topbar { padding: 18px 20px; }
            .brand-name { font-size: 20px; }
            .field, #loginBtn, #changeBtn { height: 54px; }
            .field input { font-size: 16px; }
            .modal-overlay .login-card { padding: 26px 20px; }
        }
    </style>
<style id="font-roles">
/* Bold/Heading = Samsung Sharp Sans Bold ; Regular text = SamsungOne 600C */
h1,h2,h3,h4,h5,h6,strong,b,th,legend,.font-bold,.font-semibold,.font-extrabold,.font-black{font-family:"Samsung Sharp Sans Bold", "Samsung Sharp Sans", "SamsungSharpSans-Bold", "Samsung Sharp Bold", "SamsungOne 600C", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important}
.brand-name,.logo,.sidebar-brand-text,.ld-title,.ld-role,.summary-card .val,.summary-card h4,.kpi-score-big,.kpi-live-item strong,.stat b,.pct-big,.plan-name,.sec-title,.section-title,.cat-progress-head h5,#kpiBotHead b,summary,[class*="title"],[class*="heading"],.login-card button,.logout-btn,.btn-primary,button[type="submit"],.kb-tag{font-family:"Samsung Sharp Sans Bold", "Samsung Sharp Sans", "SamsungSharpSans-Bold", "Samsung Sharp Bold", "SamsungOne 600C", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;font-weight:700 !important}
</style>
</head>
<body>

    <!-- Loading screen (shown after a successful login, before the landing page) -->
    <div id="loader" aria-live="polite" aria-label="Loading">
        <div class="blob b1"></div><div class="blob b2"></div><div class="gridbg"></div>
        <div class="ld-core">
            <div class="ld-orbit"><div class="ring"></div><div class="ring r2"></div><div class="dot"></div><div class="ld-logo">MX</div></div>
            <h1 class="ld-title"><span id="ldTitle">Training Portal</span></h1>
            <p class="ld-role" id="ldRole">Training Portal</p>
            <div class="ld-bar"><i></i></div>
            <div class="ld-msg">Preparing your workspace…</div>
        </div>
    </div>

    <!-- Login Container -->
    <div class="login-container" id="loginContainer">
        <div class="geo" aria-hidden="true">
            <span class="sh big ring g-spin"   style="width:560px;height:560px;right:2%;top:6%"></span>
            <span class="sh big ring solid g-spinr" style="width:380px;height:380px;right:9%;top:16%"></span>
            <span class="sh sq g-float"  style="width:92px;height:92px;left:5%;top:20%"></span>
            <span class="sh sq f g-float2" style="width:64px;height:64px;left:44%;top:12%"></span>
            <span class="sh orb g-pulse" style="width:22px;height:22px;left:38%;top:30%"></span>
            <span class="sh orb g-float2" style="width:14px;height:14px;left:92%;top:20%"></span>
            <span class="sh orb g-pulse" style="width:30px;height:30px;left:8%;top:78%"></span>
            <span class="sh dots g-drift" style="width:220px;height:220px;left:-30px;bottom:-30px"></span>
            <span class="sh dots big g-drift" style="width:200px;height:200px;right:30%;top:-40px;animation-delay:-6s"></span>
            <span class="sh ln g-slide" style="width:240px;left:14%;top:62%"></span>
            <span class="sh ln big g-slide" style="width:180px;right:6%;top:88%;animation-delay:-5s"></span>
            <svg class="sh c2 g-float" style="width:70px;height:70px;left:30%;bottom:10%" viewBox="0 0 70 70"><polygon points="35,6 64,60 6,60"/></svg>
            <svg class="sh c1 g-float2 big" style="width:56px;height:56px;right:3%;top:48%" viewBox="0 0 56 56"><polygon points="28,3 52,16 52,40 28,53 4,40 4,16"/></svg>
            <svg class="sh c1 g-spin" style="width:34px;height:34px;left:20%;top:8%" viewBox="0 0 34 34"><path d="M17 3v28M3 17h28"/></svg>
            <svg class="sh c2 g-spinr" style="width:26px;height:26px;left:52%;bottom:14%" viewBox="0 0 26 26"><path d="M13 2v22M2 13h22"/></svg>
            <svg class="sh c2 g-float big" style="width:60px;height:60px;right:36%;bottom:6%" viewBox="0 0 60 60"><circle cx="30" cy="30" r="24"/><circle class="fill" cx="30" cy="30" r="3"/></svg>
        </div>
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">TP</div>
                <span class="brand-name">Training Portal</span>
            </div>
        </header>

        <main class="split">
            <div class="login-card">
                <h2>Log-In</h2>
                <p class="sub">Welcome back. Please log in using your account to continue.</p>
                <div class="form-group">
                    <label for="userInput">User (NS + User ID)</label>
                    <div class="field">
                        <input type="text" id="userInput" placeholder="E.g., email@company.com" autocomplete="username" autocapitalize="none" spellcheck="false">
                    </div>
                </div>
                <div class="form-group">
                    <label for="passwordInput">Password</label>
                    <div class="field">
                        <input type="password" id="passwordInput" placeholder="Enter your password" autocomplete="current-password">
                        <button type="button" class="eye" id="eyeBtn" aria-label="Show password" title="Show / hide password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                <button onclick="handleLogin()" id="loginBtn">Log In</button>
                <div class="error-msg" id="errorMsg"></div>
                <p class="fine">Having trouble signing in? Please contact your administrator.</p>

    <!-- Password Change Modal -->
    <div class="modal-overlay" id="changePassModal">
        <div class="login-card" style="display: block;">
            <h2>Change Password</h2>
            <p class="sub">You are required to change your temporary password.</p>
            <div class="form-group">
                <label for="newPasswordInput">New Password</label>
                <div class="field"><input type="password" id="newPasswordInput" placeholder="••••••••" autocomplete="new-password"></div>
            </div>
            <div class="form-group">
                <label for="confirmPasswordInput">Confirm New Password</label>
                <div class="field"><input type="password" id="confirmPasswordInput" placeholder="••••••••" autocomplete="new-password"></div>
            </div>
            <button onclick="submitNewPassword()" id="changeBtn">Save Password</button>
            <div class="error-msg" id="modalErrorMsg"></div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyRvkqZdaAAwWtl59hu4qOvQ-6u-QIgVRMM47h_HJ5wLVPIezlFfoI7Kcoung-tWxg5/exec";
        var loggedInUser = "";

        window.onload = function() {
            let savedUser = localStorage.getItem('portal_user');
            if (savedUser) {
                let savedRole = (localStorage.getItem('portal_role') || "").toLowerCase();
                let savedJobGroup = localStorage.getItem('portal_jobgroup') || "";
                redirectUserByRole(savedRole, savedJobGroup);
            }

            document.getElementById('passwordInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') handleLogin();
            });
            document.getElementById('userInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') handleLogin();
            });
        };

        // Collects device info from the browser to be saved in the LOGS sheet
        function getDeviceInfo() {
            var ua = navigator.userAgent || "";
            var os = "Unknown", browser = "Unknown", deviceType = "Desktop", deviceModel = "";

            if (/Windows NT 10/i.test(ua)) os = "Windows 10/11";
            else if (/Windows NT/i.test(ua)) os = "Windows";
            else if (/Android\s([\d.]+)/i.test(ua)) os = "Android " + ua.match(/Android\s([\d.]+)/i)[1];
            else if (/(iPhone|iPad|iPod).*OS\s([\d_]+)/i.test(ua)) os = "iOS " + ua.match(/OS\s([\d_]+)/i)[1].replace(/_/g, ".");
            else if (/Mac OS X/i.test(ua)) os = "macOS";
            else if (/CrOS/i.test(ua)) os = "ChromeOS";
            else if (/Linux/i.test(ua)) os = "Linux";

            if (/Edg\//i.test(ua)) browser = "Edge " + (ua.match(/Edg\/([\d.]+)/i) || [])[1];
            else if (/OPR\//i.test(ua)) browser = "Opera " + (ua.match(/OPR\/([\d.]+)/i) || [])[1];
            else if (/SamsungBrowser\//i.test(ua)) browser = "Samsung Internet";
            else if (/Firefox\//i.test(ua)) browser = "Firefox " + (ua.match(/Firefox\/([\d.]+)/i) || [])[1];
            else if (/Chrome\//i.test(ua)) browser = "Chrome " + (ua.match(/Chrome\/([\d.]+)/i) || [])[1];
            else if (/Safari\//i.test(ua)) browser = "Safari " + (ua.match(/Version\/([\d.]+)/i) || [])[1];

            if (/iPad|Tablet/i.test(ua) || (/Android/i.test(ua) && !/Mobile/i.test(ua))) deviceType = "Tablet";
            else if (/Mobi|iPhone|iPod|Android/i.test(ua)) deviceType = "Mobile";

            if (/iPhone/i.test(ua)) deviceModel = "iPhone";
            else if (/iPad/i.test(ua)) deviceModel = "iPad";
            else {
                var m = ua.match(/Android[^;]*;\s*([^;)]+?)(?:\sBuild|\))/i);
                if (m) deviceModel = m[1].trim();
            }

            return {
                deviceType: deviceType,
                deviceModel: deviceModel,
                os: os,
                browser: String(browser).trim(),
                screen: (window.screen ? screen.width + "x" + screen.height : "") + " @" + (window.devicePixelRatio || 1) + "x",
                tz: (Intl.DateTimeFormat().resolvedOptions().timeZone) || "",
                lang: navigator.language || "",
                ua: ua
            };
        }

        async function handleLogin() {
            var userInput = document.getElementById('userInput').value.trim();
            var passwordInput = document.getElementById('passwordInput').value.trim();
            var btn = document.getElementById('loginBtn');
            var errorMsg = document.getElementById('errorMsg');

            if(!userInput || !passwordInput) { 
                errorMsg.innerText = "Please fill in all fields."; 
                return; 
            }
            
            errorMsg.innerText = "";
            btn.innerText = "Verifying...";     
            btn.disabled = true;

            try {
                let d = getDeviceInfo();
                let url = `${WEB_APP_URL}?action=login&user=${encodeURIComponent(userInput)}&pass=${encodeURIComponent(passwordInput)}`
                    + `&deviceType=${encodeURIComponent(d.deviceType)}&deviceModel=${encodeURIComponent(d.deviceModel)}`
                    + `&os=${encodeURIComponent(d.os)}&browser=${encodeURIComponent(d.browser)}`
                    + `&screen=${encodeURIComponent(d.screen)}&tz=${encodeURIComponent(d.tz)}`
                    + `&lang=${encodeURIComponent(d.lang)}&ua=${encodeURIComponent(d.ua)}`;
                let response = await fetch(url);
                let result = await response.json();
                
                btn.innerText = "Login"; 
                btn.disabled = false;

                if (result.success) {
                    loggedInUser = userInput;

                    if (result.mustChangePassword) {
                        document.getElementById('loginContainer').style.display = 'none';
                        document.getElementById('changePassModal').style.display = 'flex';
                        return;
                    }
                    
                    let finalName = result.user;
                    if (finalName && finalName.includes('@')) {
                        let parts = finalName.split('@')[0];
                        finalName = parts.charAt(0).toUpperCase() + parts.slice(1);
                    }
                    
                    let roleStr = result.role ? result.role.toLowerCase().trim() : "";

                    // Security: Only those with a true admin role are allowed into the Admin page
                    if (roleStr === 'admin' || roleStr.includes('admin')) {
                        roleStr = 'admin';
                    } else if (userInput.toLowerCase() === 'admin' && roleStr === '') {
                        roleStr = 'admin';
                    }

                    localStorage.setItem('portal_user', userInput);
                    localStorage.setItem('portal_name', finalName); 
                    localStorage.setItem('portal_role', roleStr);
                    // Admin only: keep the password for this browser tab so Admin.html can sign in automatically (cleared when the tab closes)
                    if (roleStr === 'admin') { sessionStorage.setItem('portal_admin_pass', passwordInput); } else { sessionStorage.removeItem('portal_admin_pass'); }
                    // JOB GROUP (from the "user account" sheet) decides which ST page the trainer lands on
                    let jobGroupStr = (result.jobGroup || "").toString().trim();
                    localStorage.setItem('portal_jobgroup', jobGroupStr);
                    redirectUserByRole(roleStr, jobGroupStr);
                } else { 
                    errorMsg.innerText = result.message || "Login error encountered."; 
                }
            } catch (err) {
                btn.innerText = "Login"; 
                btn.disabled = false;
                errorMsg.innerText = "A connection error occurred.";
            }
        }

        // Job Group -> its own ST page (same matching rules as ST.html's kpiGroupKey)
        var ST_PAGE_BY_GROUP = {
            CD:    "ST_Content_Developer.html",
            SES:   "ST_SES_NSO_CX.html",
            SPLUS: "ST_SPlus_Expert_Admin.html"
        };
        function jobGroupKey(jobGroup) {
            var g = String(jobGroup || "").toLowerCase();
            if (g.indexOf("content developer") !== -1) return "CD";
            if (g.indexOf("s+") !== -1 || g.indexOf("expert") !== -1) return "SPLUS";
            if (/\bses\b|nso|customer/.test(g)) return "SES";
            return "";
        }
        function redirectUserByRole(position, jobGroup) {
            console.log("Redirecting for position:", position, "| job group:", jobGroup);
            
            // show the loading screen first, then go to the landing page
            function go(url, label) {
                var L = document.getElementById('loader');
                document.getElementById('ldRole').textContent = label;
                document.getElementById('ldTitle').textContent = "Training Portal";
                L.classList.add('show');
                requestAnimationFrame(function () { requestAnimationFrame(function () { L.classList.add('in'); }); });
                setTimeout(function () { window.location.href = url; }, 1400);
            }
            if (position.includes('sepco')) {
                go("SEPCO.html", "SEPCO");
            } else if (position === 'admin') {
                go("Admin.html", "Admin");
            } else if (position.includes('rto') || position.includes('regional training officer')) {
                go("RTO.html", "RTO");
            } else if (position.includes('sft') || position.includes('specialized field trainer')) {
                go("SFT.html", "SFT");
            } else if (position === 'st' || position.includes('specialized trainer')) {
                // ST: go straight to the page of his/her Job Group (fallback: ST.html, which also re-routes by Job Group)
                var gk = jobGroupKey(jobGroup);
                go(ST_PAGE_BY_GROUP[gk] || "ST.html", "Specialized Trainer");
            } else {
                // No portal for this role: clear the session and stay on the login page
                // (redirecting to index.html here would just reload this page forever).
                localStorage.removeItem('portal_user');
                localStorage.removeItem('portal_name');
                localStorage.removeItem('portal_role');
                localStorage.removeItem('portal_jobgroup');
                var em = document.getElementById('errorMsg');
                if (em) em.innerText = "Your account has no portal assigned. Please contact your administrator.";
            }
        }

        async function submitNewPassword() {
            var newPass = document.getElementById('newPasswordInput').value.trim();
            var confirmPass = document.getElementById('confirmPasswordInput').value.trim();
            var modalError = document.getElementById('modalErrorMsg');
            
            if (!newPass || !confirmPass) { modalError.innerText = "Please fill in all fields."; return; }
            if (newPass.length < 6) { modalError.innerText = "Password must be at least 6 characters long."; return; }
            if (newPass !== confirmPass) { modalError.innerText = "Passwords do not match."; return; }

            let changeBtn = document.getElementById('changeBtn');
            changeBtn.innerText = "Saving..."; changeBtn.disabled = true;

            try {
                let url = `${WEB_APP_URL}?action=changePassword&user=${encodeURIComponent(loggedInUser)}&newPass=${encodeURIComponent(newPass)}`;
                let response = await fetch(url);
                let result = await response.json();
                
                if (result.success) {
                    alert("Password updated successfully! Please log in again.");
                    localStorage.clear();
                    location.reload();
                } else {
                    modalError.innerText = result.message || "Failed to update password.";
                    changeBtn.innerText = "Save Password"; changeBtn.disabled = false;
                }
            } catch (err) {
                modalError.innerText = "Server connection error.";
                changeBtn.innerText = "Save Password"; changeBtn.disabled = false;
            }
        }
    </script>

    <!-- Presentation only: button turns blue once fields are filled, show/hide password -->
    <script>
        (function () {
            var u = document.getElementById('userInput'), p = document.getElementById('passwordInput'), b = document.getElementById('loginBtn');
            function sync() { b.classList.toggle('ready', u.value.trim() !== '' && p.value.trim() !== ''); }
            u.addEventListener('input', sync); p.addEventListener('input', sync);
            setTimeout(sync, 300); // browser autofill

            var np = document.getElementById('newPasswordInput'), cp = document.getElementById('confirmPasswordInput'), cb = document.getElementById('changeBtn');
            function syncChange() { cb.classList.toggle('ready', np.value.trim() !== '' && cp.value.trim() !== ''); }
            np.addEventListener('input', syncChange); cp.addEventListener('input', syncChange);

            var eye = document.getElementById('eyeBtn');
            var open = eye.innerHTML;
            var shut = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.1 10.1 0 0 1 12 19c-6.4 0-10-7-10-7a18.5 18.5 0 0 1 4.1-4.9M9.9 5.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a18.6 18.6 0 0 1-2.2 3.2M1 1l22 22"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
            eye.addEventListener('click', function () {
                var show = p.type === 'password';
                p.type = show ? 'text' : 'password';
                eye.innerHTML = show ? shut : open;
                eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            });
        })();
    </script>
